# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.262.4/schema/sveltia-cms.json
#
# Sveltia CMS per il sito GIDA. I contenuti sono in src/content/<collezione>/<lingua>/<chiave>.json:
# le traduzioni hanno lo stesso nome di file e si modificano affiancate.
# Il sito ricostruisce da questi dati il markup originale (src/lib/render.ts), compresi gli elenchi
# generati: certificazioni, impianti, Società trasparente e archivi annuali.
#
# Accesso: "Accedi con GitHub" (OAuth App GitHub + client OAuth in src/routes/api/cms-auth, vedi README)
# oppure "Lavora con Repository Locale" in Chrome/Edge con `npm run dev`.

backend:
  name: github
  repo: monemasrl/gida-spa
  # Il CMS legge e scrive su main (con l'editorial workflow le modifiche passano da pull request verso main)
  branch: main
  # Client OAuth: Function Vercel del sito (/api/cms-auth/auth → GitHub → /api/cms-auth/callback).
  # Sempre l'host di produzione, perché la OAuth App GitHub ammette un solo callback URL:
  # anche il CMS delle anteprime Vercel accede da qui (origin ammesse in #lib/server/cms-auth.ts).
  # Col dominio definitivo: cambiare base_url qui e il callback URL nella OAuth App.
  base_url: https://gida-sito.vercel.app
  auth_endpoint: api/cms-auth/auth
  # Solo OAuth; per riattivare il token come riserva: [oauth, token]
  auth_methods: [oauth]

# Ogni modifica diventa una pull request (con il suo deploy di anteprima su Vercel)
# e va in produzione solo quando viene pubblicata/unita. Va al primo livello, non dentro `backend`.
publish_mode: editorial_workflow

# Niente anteprima nell'editor (quella generica di Sveltia non somiglia al sito); resta il secondo
# pannello per affiancare italiano e inglese.
editor:
  preview: false

site_url: https://gida-sito.vercel.app
display_url: https://www.gida-spa.it

# I file sono su R2 (sotto). In static/sites/default/files restano solo favicon e frecce del tema;
# i vecchi link /sites/default/files/... reindirizzano a media.gida-spa.it.
media_folder: /static/sites/default/files
public_folder: /sites/default/files

# Nuovi file e immagini: bucket Cloudflare R2 `gida-media` (giurisdizione EU:
# API https://<account_id>.eu.r2.cloudflarestorage.com), pubblico su media.gida-spa.it.
# La Secret Access Key non va qui: ogni editor la inserisce nel CMS al primo uso (vedi README).
media_libraries:
  default: false
  cloudflare_r2:
    label: Archivio file GIDA
    access_key_id: 13646c65d2216c8e2111d18b0ceeb55e
    bucket: gida-media
    account_id: fdbdfea43bd4b5b2f80ec9fa90255e8f
    jurisdiction: eu
    public_url: https://media.gida-spa.it
    prefix: sites/default/files/

output:
  json:
    indent_style: tab
  omit_empty_optional_fields: true

i18n:
  structure: multiple_folders
  locales: [it, en]
  default_locale: it
  # le voci nuove partono solo in italiano; la traduzione inglese si attiva quando serve
  initial_locales: default

# ---------------------------------------------------------------------------------------------
# Campi riutilizzati (ancore YAML)
# ---------------------------------------------------------------------------------------------
_f:
  title: &title { name: title, label: Titolo, widget: string, i18n: true }
  description: &description
    { name: description, label: Descrizione (meta), widget: text, required: false, i18n: true, hint: Testo per i motori di ricerca }
  path: &path
    name: path
    label: URL
    widget: string
    required: false
    i18n: true
    hint: Lasciare vuoto per usare il nome del file (es. /nome-file, /en/nome-file). Cambiarlo rompe i link esistenti.
    pattern: ['^/[a-z0-9][a-z0-9/._-]*$', "Percorso che inizia con / (minuscole, numeri e trattini)"]
  body: &body { name: body, label: Testo, widget: richtext, format: html, required: false, i18n: true }
  order: &order
    { name: order, label: Ordine negli elenchi, widget: number, value_type: int, required: false, i18n: duplicate, hint: I numeri più bassi vengono prima }
  unlisted: &unlisted
    { name: unlisted, label: Nascondi negli elenchi, widget: boolean, required: false, default: false, i18n: duplicate, hint: La pagina resta raggiungibile dal suo URL }
  image: &image
    widget: object
    i18n: true
    summary: '{{alt}}'
    fields:
      - { name: src, label: Immagine, widget: image, i18n: true }
      - { name: alt, label: Testo alternativo, widget: string, required: false, i18n: true }
  link: &link
    widget: object
    i18n: true
    summary: '{{title}}'
    fields:
      - { name: title, label: Testo, widget: string, i18n: true }
      - { name: href, label: Link (URL o file), widget: string, i18n: true, hint: 'Es. https://media.gida-spa.it/sites/default/files/... oppure /pagina' }

_c:
  entries: &entries
    format: json
    i18n: true
    identifier_field: title
    slug: '{{slug}}'
    duplicate: false
    sortable_fields: [title, path]

collections:
  # -------------------------------------------------------------------------------------------
  - name: pagine
    label: Pagine
    label_singular: Pagina
    icon: description
    folder: /src/content/pagine
    <<: *entries
    summary: '{{title}} — {{path}}'
    table_columns:
      - title
      - { field: path, label: URL }
    fields:
      - *title
      - *description
      - *path
      - { name: hero, label: Immagine di testata, required: false, <<: *image }
      - { name: icon, label: Icona, required: false, <<: *image }
      - *body
      - name: sezioni
        label: Contenuto a sezioni
        label_singular: Sezione
        widget: list
        required: false
        i18n: true
        hint: Parti del contenuto con un'impaginazione propria (allegati, galleria, organi societari...), mostrate in ordine dopo il Testo.
        types:
          - name: testo
            label: Testo
            summary: '{{body | truncate(60)}}'
            fields:
              - *body
              - { name: centrato, label: Testo centrato, widget: boolean, required: false, default: false, i18n: duplicate }
          - name: allegati
            label: Allegati
            fields:
              - { name: files, label: File, widget: file, multiple: true, i18n: true, hint: Il testo del link è il nome del file. }
              - { name: elenco, label: Mostra come elenco puntato, widget: boolean, required: false, default: false, i18n: duplicate }
          - name: galleria
            label: Galleria di immagini
            fields:
              - { name: images, label: Immagini, label_singular: Immagine, widget: list, i18n: true, <<: *image }
          - name: immagine
            label: Immagine (con link)
            fields:
              - { name: image, label: Immagine, <<: *image }
              - { name: link, label: Link, widget: string, required: false, i18n: true }
          - name: riquadro
            label: Riquadro evidenziato
            hint: Testo su sfondo colorato (es. orari di apertura).
            fields:
              - *body
          - name: organi
            label: Organi societari
            summary: '{{title}}'
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - { name: anchor, label: Ancora, widget: string, required: false, i18n: duplicate, hint: "Per i link diretti alla sezione (es. cda → /chi-siamo#cda)" }
              - name: groups
                label: Gruppi
                label_singular: Gruppo
                widget: list
                i18n: true
                summary: '{{title}}'
                fields:
                  - { name: title, label: Titolo, widget: string, i18n: true }
                  - { name: riquadri, label: Schede affiancate, widget: boolean, required: false, default: false, i18n: duplicate }
                  - { name: compatto, label: Elenco compatto (solo nomi), widget: boolean, required: false, default: false, i18n: duplicate }
                  - name: members
                    label: Persone
                    label_singular: Persona
                    widget: list
                    i18n: true
                    summary: '{{name}}'
                    fields:
                      - { name: name, label: Nome, widget: string, i18n: true }
                      - { name: role, label: Ruolo, widget: string, required: false, i18n: true }
                      - { name: email, label: Email, widget: string, required: false, i18n: duplicate }
                      - { name: nomina, label: Nomina, widget: string, required: false, i18n: true }
                      - { name: compenso, label: Compenso, widget: string, required: false, i18n: true }
          - name: avviso
            label: Avviso "in aggiornamento"
            fields:
              - { name: text, label: Testo, widget: string, i18n: true }
              - { name: visibile, label: Visibile, widget: boolean, required: false, default: false, i18n: duplicate }
          - name: html
            label: HTML libero
            fields:
              - { name: html, label: HTML, widget: code, default_language: html, allow_language_selection: false, output_code_only: true, i18n: true }
      - { name: faq, label: Mostra le FAQ, widget: boolean, required: false, default: false, i18n: duplicate, hint: Elenca le domande della collezione FAQ (nel loro ordine) }
      - name: blocks
        label: Blocchi sotto il contenuto
        label_singular: Blocco
        widget: list
        required: false
        i18n: true
        types:
          - name: form
            label: Modulo di contatto
            fields:
              - { name: form, label: Modulo, widget: select, i18n: true, options: [{ label: Contatti, value: form-contatti }, { label: Visite scuole, value: scuole }] }
          - name: certificazioni
            label: Elenco certificazioni
            summary: '{{tipi}}'
            fields:
              - name: tipi
                label: Tipi da mostrare (in quest'ordine)
                widget: relation
                multiple: true
                i18n: true
                collection: configurazioni
                file: categorie
                value_field: certificazioni.*.id
                display_fields: [certificazioni.*.it]
                search_fields: [certificazioni.*.it]
              - { name: view, widget: hidden, i18n: true }
          - name: impianti
            label: Elenco impianti
            fields:
              - { name: menu, label: Menu di ancore, widget: list, required: false, i18n: true, summary: '{{title}}', fields: [{ name: title, label: Testo, widget: string, i18n: true }, { name: href, label: 'Ancora (#titolo impianto in minuscolo)', widget: string, i18n: true }] }
          - name: pubblicazioni
            label: Pubblicazioni scientifiche
            summary: '{{title}}'
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - { name: items, label: Pubblicazioni, widget: list, i18n: true, summary: '{{title}}', fields: [{ name: title, label: Titolo, widget: string, i18n: true }, { name: href, label: File, widget: file, i18n: true }] }
          - name: progetti
            label: Progetti di ricerca
            summary: '{{title}}'
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - name: items
                label: Progetti
                widget: list
                i18n: true
                fields:
                  - { name: document, label: Documento, required: false, <<: *link }
                  - { name: links, label: Link esterni, widget: list, required: false, i18n: true, summary: '{{title}}', fields: [{ name: title, label: Testo, widget: string, i18n: true }, { name: href, label: URL, widget: string, i18n: true }] }
          - name: trasparenza
            label: Società trasparente (documenti dell'anno corrente e archivio)
            fields: []
          - name: html
            label: HTML libero
            fields:
              - { name: html, label: HTML, widget: code, default_language: html, allow_language_selection: false, output_code_only: true, i18n: true }

  # -------------------------------------------------------------------------------------------
  - name: news
    label: News
    label_singular: News
    icon: newspaper
    folder: /src/content/news
    <<: *entries
    fields:
      - *title
      - *description
      - *path
      - { name: image, label: Immagine, required: false, <<: *image }
      - *body

  # -------------------------------------------------------------------------------------------
  - name: faq
    label: FAQ
    label_singular: Domanda
    icon: quiz
    folder: /src/content/faq
    format: json
    i18n: true
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{order}}. {{title}}'
    description: Domande frequenti, mostrate nelle pagine con "Mostra le FAQ" attivo (pagina FAQ).
    sortable_fields: { fields: [order, title], default: { field: order, direction: ascending } }
    fields:
      - { name: title, label: Domanda, widget: string, i18n: true }
      - { name: answer, label: Risposta, widget: richtext, format: html, i18n: true }
      - *order

  # -------------------------------------------------------------------------------------------
  - name: impianti
    label: Impianti
    label_singular: Impianto
    icon: factory
    folder: /src/content/impianti
    <<: *entries
    description: Compaiono nell'elenco della pagina Depurazione, nell'ordine indicato.
    sortable_fields: { fields: [order, title], default: { field: order, direction: ascending } }
    fields:
      - *title
      - *description
      - *path
      - { name: image, label: Immagine, required: false, <<: *image }
      - *body
      - *order

  # -------------------------------------------------------------------------------------------
  - name: certificazioni
    label: Certificazioni e autorizzazioni
    label_singular: Documento
    icon: verified
    folder: /src/content/certificazioni
    <<: *entries
    summary: "{{title}} · {{tipo}} · ordine {{order}}{{unlisted | ternary(' · nascosto', '')}}"
    table_columns:
      - title
      - { field: tipo, label: Tipo }
      - { field: order, label: Ordine }
      - { field: unlisted, label: Nascosto }
    sortable_fields: { fields: [order, title], default: { field: order, direction: ascending } }
    view_groups:
      - { label: Tipo, field: tipo }
    fields:
      - *title
      - *path
      - { name: file, label: File, widget: file, i18n: true }
      - name: tipo
        label: Tipo
        widget: relation
        i18n: duplicate
        dropdown_threshold: 0
        collection: configurazioni
        file: categorie
        value_field: certificazioni.*.id
        display_fields: [certificazioni.*.it]
        search_fields: [certificazioni.*.it]
      - *order
      - *unlisted

  # -------------------------------------------------------------------------------------------
  - name: trasparenza
    label: Società trasparente — documenti
    label_singular: Documento
    icon: folder_open
    folder: /src/content/trasparenza
    <<: *entries
    summary: "{{title}} · {{tipo}}{{unlisted | ternary(' · nascosto', '')}}"
    table_columns:
      - title
      - { field: tipo, label: Categoria }
      - { field: order, label: Ordine }
      - { field: unlisted, label: Nascosto }
    # Una cartella per anno (trasparenza/<lingua>/<anno>/): nella barra laterale gli anni compaiono
    # come sottocartelle. L'anno del documento è quello della cartella in cui si trova.
    nested: { depth: 2, subfolders: false }
    meta: { path: { label: Anno } }
    sortable_fields: { fields: [title, order], default: { field: order, direction: ascending } }
    view_groups:
      - { label: Categoria, field: tipo }
    fields:
      - *title
      - *path
      - name: tipo
        label: Categoria
        widget: relation
        i18n: duplicate
        collection: configurazioni
        file: categorie
        value_field: trasparenza.*.id
        display_fields: [trasparenza.*.it]
        search_fields: [trasparenza.*.it]
      - *body
      - { name: files, label: File, widget: list, required: false, i18n: true, field: { name: file, label: File, widget: file } }
      - *order
      - *unlisted

  # -------------------------------------------------------------------------------------------
  - divider: true
  - name: home
    label: Home page
    icon: home
    i18n: true
    files:
      - name: home
        label: Home page
        icon: home
        file: /src/content/home/{{locale}}.json
        format: json
        i18n: true
        fields:
          - *title
          - *description
          - { name: hero, label: Immagine di testata, <<: *image }
          - { name: mission, label: La nostra mission, widget: richtext, format: html, i18n: true }
          - name: settori
            label: I nostri settori
            widget: object
            i18n: true
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - name: items
                label: Settori
                widget: list
                i18n: true
                summary: '{{title}}'
                fields:
                  - { name: icon, label: Icona, <<: *image }
                  - { name: title, label: Titolo, widget: string, i18n: true }
                  - { name: text, label: Testo, widget: richtext, format: html, i18n: true }
                  - { name: link, label: Link, widget: string, i18n: true }
          - name: percorso
            label: Percorso dell'acqua
            widget: object
            i18n: true
            fields:
              - { name: background, label: Sfondo, <<: *image }
              - { name: icon, label: Icona, <<: *image }
              - { name: text, label: Testo del pulsante, widget: string, i18n: true }
              - { name: file, label: File (mappa), widget: file, i18n: true }
          - name: ricerca
            label: Formazione e ricerca
            widget: object
            i18n: true
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - { name: text, label: Testo, widget: richtext, format: html, i18n: true }
              - { name: link, label: Link, widget: string, i18n: true }
              - { name: image, label: Immagine, <<: *image }
          - name: scuole
            label: GIDA nelle scuole
            widget: object
            i18n: true
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - { name: linkText, label: Testo del link, widget: string, i18n: true }
              - { name: link, label: Link, widget: string, i18n: true }
              - { name: mascotte, label: Mascotte, <<: *image }
              - { name: background, label: Sfondo, <<: *image }
  - name: menu
    label: Menu
    icon: menu
    i18n: true
    files:
      - name: menu-superiore
        label: Menu superiore
        icon: more_horiz
        file: /src/content/layout/menu-superiore/{{locale}}.json
        format: json
        i18n: true
        fields:
          - name: items
            label: Voci
            label_singular: Voce
            widget: list
            i18n: true
            summary: '{{label}} → {{href}}'
            fields:
              - { name: label, label: Etichetta, widget: string, i18n: true }
              - { name: href, label: Link, widget: string, i18n: true }
      - name: menu-principale
        label: Menu principale
        icon: menu
        file: /src/content/layout/menu-principale/{{locale}}.json
        format: json
        i18n: true
        fields:
          - name: items
            label: Voci
            label_singular: Voce
            widget: list
            i18n: true
            summary: '{{label}}'
            fields:
              - { name: label, label: Etichetta, widget: string, i18n: true }
              - { name: href, label: Link, widget: string, required: false, i18n: true, hint: Vuoto per una voce che apre solo il sottomenu }
              - name: children
                label: Sottomenu
                label_singular: Voce
                widget: list
                required: false
                i18n: true
                summary: '{{label}} → {{href}}'
                fields:
                  - { name: label, label: Etichetta, widget: string, i18n: true }
                  - { name: href, label: Link, widget: string, i18n: true }
  - divider: true
  - name: configurazioni
    label: Configurazioni
    icon: settings
    i18n: true
    files:
      - name: testata
        label: Testata (logo e contatti)
        icon: web_asset
        file: /src/content/layout/testata/{{locale}}.json
        format: json
        i18n: true
        fields:
          - { name: logo, label: Logo, widget: image, i18n: duplicate }
          - name: contatti
            label: Contatti in alto
            label_singular: Contatto
            widget: list
            i18n: true
            summary: '{{label}} {{text}}'
            fields:
              - { name: label, label: Etichetta (in grassetto), widget: string, i18n: true, hint: 'Es. Tel, mail:' }
              - { name: text, label: Testo, widget: string, i18n: true }
              - { name: href, label: Link, widget: string, required: false, i18n: duplicate, hint: 'Es. tel:+39 0574 646511, mailto:gida@gida-spa.it' }
      - name: footer
        label: Footer
        icon: call_to_action
        file: /src/content/layout/footer/{{locale}}.json
        format: json
        i18n: true
        fields:
          - name: cruscotto
            label: Cruscotto energia solare
            widget: object
            i18n: true
            fields:
              - { name: title, label: Titolo, widget: string, i18n: true }
              - name: items
                label: Valori
                label_singular: Valore
                widget: list
                i18n: true
                summary: '{{label}}: {{value}}'
                fields: &valore
                  - { name: label, label: Etichetta, widget: string, i18n: true }
                  - { name: value, label: Valore, widget: string, i18n: true, hint: Es. 2860.0 KWh }
              - { name: totale, label: Totale, widget: object, i18n: true, fields: *valore }
          - name: dati
            label: Dati societari (prima colonna)
            widget: object
            i18n: true
            fields:
              - { name: logo, label: Logo, required: false, <<: *image }
              - name: righe
                label: Righe
                label_singular: Riga
                widget: list
                i18n: true
                summary: '{{testo}}'
                fields:
                  - { name: testo, label: Testo, widget: string, required: false, i18n: true }
                  - name: links
                    label: Link (dopo il testo, separati da |)
                    label_singular: Link
                    widget: list
                    required: false
                    i18n: true
                    summary: '{{label}}'
                    fields: &footer_link
                      - { name: label, label: Testo, widget: string, i18n: true }
                      - { name: href, label: Link (URL o file), widget: string, i18n: true }
                      - { name: newTab, label: Apri in una nuova scheda, widget: boolean, required: false, default: false, i18n: duplicate }
          - name: menu
            label: Menu del footer (seconda colonna)
            label_singular: Voce
            widget: list
            i18n: true
            summary: '{{label}} → {{href}}'
            fields: *footer_link
          - name: certificazioni
            label: Certificazioni (terza colonna)
            widget: object
            i18n: true
            fields:
              - name: loghi
                label: Loghi
                label_singular: Logo
                widget: list
                i18n: true
                summary: '{{image.alt}}'
                fields:
                  - { name: image, label: Immagine, <<: *image }
                  - { name: href, label: Link (certificato), widget: string, i18n: true }
                  - { name: newTab, label: Apri in una nuova scheda, widget: boolean, required: false, default: false, i18n: duplicate }
              - { name: links, label: Pulsanti, label_singular: Pulsante, widget: list, i18n: true, summary: '{{label}}', fields: *footer_link }
      - name: anni
        label: Anni (Società trasparente)
        icon: calendar_month
        file: /src/content/configurazioni/anni.json
        format: json
        fields:
          - { name: annoCorrente, label: Anno corrente, widget: string, pattern: ['^\d{4}$', Anno a quattro cifre], hint: Documenti mostrati nella pagina Società trasparente; gli anni precedenti vanno in Archivio }
          - { name: anni, label: Anni con pagina d'archivio, label_singular: Anno, widget: list, hint: "Gli anni che hanno documenti (cartelle in Società trasparente) si aggiungono da soli", field: { name: anno, label: Anno, widget: string } }
      - name: categorie
        label: Categorie
        icon: category
        file: /src/content/configurazioni/categorie.json
        format: json
        fields:
          - name: trasparenza
            label: Categorie di Società trasparente (nell'ordine di visualizzazione)
            label_singular: Categoria
            widget: list
            summary: '{{it}} / {{en}}'
            fields:
              - { name: id, label: Id, widget: string, hint: Identificativo stabile (minuscole e trattini), pattern: ['^[a-z0-9-]+$', 'Solo minuscole, numeri e trattini'] }
              - { name: it, label: Nome italiano, widget: string, required: false }
              - { name: en, label: Nome inglese, widget: string, required: false }
              - { name: parent, label: Categoria superiore (id), widget: string, required: false }
          - name: certificazioni
            label: Tipi di certificazione
            label_singular: Tipo
            widget: list
            summary: '{{it}} / {{en}}'
            fields:
              - { name: id, label: Id, widget: string, pattern: ['^[a-z0-9-]+$', 'Solo minuscole, numeri e trattini'] }
              - { name: it, label: Nome italiano, widget: string, required: false }
              - { name: en, label: Nome inglese, widget: string, required: false }
